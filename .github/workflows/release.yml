name: Windows Optimizer releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained single-file app
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish/${{ matrix.rid }}
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WindowsOptimizer-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizer-${{ matrix.rid }}
          path: WindowsOptimizer-${{ matrix.rid }}.zip
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WindowsOptimizer-${{ matrix.rid }}.zip
          generate_release_notes: true
