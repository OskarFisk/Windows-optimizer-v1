name: Windows Optimizer releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        # LibreHardwareMonitor's NuGet package is currently published for Windows x64.
        # Keep the production release on x64 until a verified ARM64 dependency set is available.
        rid: [win-x64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained app
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=None -o publish/${{ matrix.rid }}
      - name: Verify portable build
        shell: pwsh
        run: |
          if (!(Test-Path "publish/${{ matrix.rid }}/WindowsOptimizer.exe")) {
            throw 'WindowsOptimizer.exe was not produced.'
          }
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WindowsOptimizer-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizer-${{ matrix.rid }}
          path: WindowsOptimizer-${{ matrix.rid }}.zip

  build-setup:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'
      - name: Publish x64 app for setup.exe
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -o publish/win-x64
      - name: Verify setup payload
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/win-x64/WindowsOptimizer.exe')) {
            throw 'WindowsOptimizer.exe was not produced.'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/Windows | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/WindowsOptimizerSetup.iss
          if (-not (Test-Path 'pkg/Windows/WindowsOptimizerSetup.exe')) { throw 'Setup executable was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizerSetup
          path: pkg/Windows/WindowsOptimizerSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true
