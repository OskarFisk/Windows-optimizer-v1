name: Windows Optimizer releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish self-contained app
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:DebugType=None -o publish/${{ matrix.rid }}

      - name: Verify portable build
        shell: pwsh
        run: |
          if (!(Test-Path "publish/${{ matrix.rid }}/WindowsOptimizer.exe")) {
            throw 'WindowsOptimizer.exe was not produced.'
          }

      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WindowsOptimizer-${{ matrix.rid }}.zip -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v6
        with:
          name: WindowsOptimizer-${{ matrix.rid }}
          path: WindowsOptimizer-${{ matrix.rid }}.zip
          if-no-files-found: error

  build-setup:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish x64 app for setup.exe
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r win-x64 --self-contained true -p:DebugType=None -o publish/win-x64

      - name: Verify setup payload
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/win-x64/WindowsOptimizer.exe')) {
            throw 'WindowsOptimizer.exe was not produced.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/Windows | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/WindowsOptimizerSetup.iss
          if (-not (Test-Path 'pkg/Windows/WindowsOptimizerSetup.exe')) {
            throw 'Setup executable was not created.'
          }

      - name: Upload setup artifact
        uses: actions/upload-artifact@v6
        with:
          name: WindowsOptimizerSetup
          path: pkg/Windows/WindowsOptimizerSetup.exe
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-setup]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-files
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          test -f release-files/WindowsOptimizerSetup.exe
          test -f release-files/WindowsOptimizer-win-x64.zip
          sha256sum release-files/WindowsOptimizerSetup.exe release-files/WindowsOptimizer-win-x64.zip > release-files/SHA256SUMS.txt

      - name: Publish packages to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # A unique tag is used for main-branch builds so the action creates a
          # new release instead of attempting to update the old 'latest' release.
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('latest-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Windows Optimizer {0}', github.ref_name) || format('Windows Optimizer - Latest #{0}', github.run_number) }}
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            release-files/WindowsOptimizerSetup.exe
            release-files/WindowsOptimizer-win-x64.zip
            release-files/SHA256SUMS.txt
          generate_release_notes: false
