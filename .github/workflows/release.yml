name: Windows Optimizer releases

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained single-file app
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish/${{ matrix.rid }}
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.rid }}/* -DestinationPath WindowsOptimizer-${{ matrix.rid }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizer-${{ matrix.rid }}
          path: WindowsOptimizer-${{ matrix.rid }}.zip

  build-setup:
    runs-on: windows-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish x64 app for setup.exe
        run: dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o publish/win-x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/Windows | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/WindowsOptimizerSetup.iss
          if (-not (Test-Path 'pkg/Windows/WindowsOptimizerSetup.exe')) { throw 'Setup executable was not created.' }
      - uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizerSetup
          path: pkg/Windows/WindowsOptimizerSetup.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-files
      - uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          generate_release_notes: true
