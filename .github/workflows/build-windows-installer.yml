name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/WindowsOptimizer/WindowsOptimizer.csproj

      - name: Publish self-contained x64
        run: >-
          dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:DebugType=None
          -o publish/win-x64

      - name: Verify application payload
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/win-x64/WindowsOptimizer.exe')) {
            throw 'WindowsOptimizer.exe was not produced.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/Windows | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/WindowsOptimizerSetup.iss
          if (!(Test-Path 'pkg/Windows/WindowsOptimizerSetup.exe')) {
            throw 'WindowsOptimizerSetup.exe was not created.'
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash 'pkg/Windows/WindowsOptimizerSetup.exe' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  WindowsOptimizerSetup.exe" } |
            Set-Content 'pkg/Windows/SHA256SUMS.txt'

          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath 'pkg/Windows/WindowsOptimizer-win-x64.zip' -Force

          Get-FileHash 'pkg/Windows/WindowsOptimizer-win-x64.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  WindowsOptimizer-win-x64.zip" } |
            Add-Content 'pkg/Windows/SHA256SUMS.txt'

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsOptimizer-Windows
          path: pkg/Windows/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pkg/Windows/WindowsOptimizerSetup.exe
            pkg/Windows/WindowsOptimizer-win-x64.zip
            pkg/Windows/SHA256SUMS.txt
          generate_release_notes: true
