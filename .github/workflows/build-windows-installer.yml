name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

env:
  # Force all JavaScript-based GitHub Actions in this workflow to use Node.js 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Verify Node.js 24
        shell: pwsh
        run: |
          $major = [int]((node --version) -replace '^v','').Split('.')[0]
          if ($major -ne 24) { throw "Expected Node.js 24, found Node.js $major" }

      - name: Restore
        run: dotnet restore src/WindowsOptimizer/WindowsOptimizer.csproj

      - name: Publish self-contained x64
        run: >-
          dotnet publish src/WindowsOptimizer/WindowsOptimizer.csproj
          -c Release -r win-x64 --self-contained true
          -p:DebugType=None
          -o publish/win-x64

      - name: Verify application payload
        shell: pwsh
        run: |
          if (!(Test-Path 'publish/win-x64/WindowsOptimizer.exe')) {
            throw 'WindowsOptimizer.exe was not produced.'
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pkg/Windows | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' installer/windows/WindowsOptimizerSetup.iss
          if (!(Test-Path 'pkg/Windows/WindowsOptimizerSetup.exe')) {
            throw 'WindowsOptimizerSetup.exe was not created.'
          }

      - name: Generate checksums
        shell: pwsh
        run: |
          Get-FileHash 'pkg/Windows/WindowsOptimizerSetup.exe' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  WindowsOptimizerSetup.exe" } |
            Set-Content 'pkg/Windows/SHA256SUMS.txt'

          Compress-Archive -Path 'publish/win-x64/*' -DestinationPath 'pkg/Windows/WindowsOptimizer-win-x64.zip' -Force

          Get-FileHash 'pkg/Windows/WindowsOptimizer-win-x64.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  WindowsOptimizer-win-x64.zip" } |
            Add-Content 'pkg/Windows/SHA256SUMS.txt'

      - name: Verify package files
        shell: pwsh
        run: |
          if (!(Test-Path 'pkg/Windows/WindowsOptimizerSetup.exe')) { throw 'Missing setup.exe' }
          if (!(Test-Path 'pkg/Windows/WindowsOptimizer-win-x64.zip')) { throw 'Missing portable ZIP' }
          if (!(Test-Path 'pkg/Windows/SHA256SUMS.txt')) { throw 'Missing SHA256SUMS.txt' }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: WindowsOptimizer-Windows
          path: pkg/Windows/*
          if-no-files-found: error
